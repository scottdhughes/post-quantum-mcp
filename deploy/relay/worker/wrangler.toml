name = "quantum-seal-relay"
main = "src/index.ts"
compatibility_date = "2026-04-01"

[vars]
MAX_ENVELOPE_SIZE = "51200"       # 50KB
MAX_MESSAGES_PER_MAILBOX = "1000"
MESSAGE_TTL_SECONDS = "86400"     # 24 hours
RATE_LIMIT_POST_PER_MIN = "60"
RATE_LIMIT_GET_PER_MIN = "120"
TRUSTED_IPS = ""              # comma-separated IPs that bypass rate limiting
# Provision with `wrangler secret put RELAY_ADMIN_TOKEN` (at least 16 characters).
# The runtime rejects missing or development placeholder admin credentials.

[[durable_objects.bindings]]
name = "MAILBOXES"
class_name = "Mailbox"

[[durable_objects.bindings]]
name = "RATE_LIMITERS"
class_name = "RateLimiter"

[[migrations]]
tag = "v1-sqlite-mailboxes"
new_sqlite_classes = ["Mailbox", "RateLimiter"]

# Legacy namespace retained for operator-controlled drain/export; new routes do not read it.
[[kv_namespaces]]
binding = "MAILBOX"
id = "705ade496106445a8b604f0a0c340ac8"
